name: VitalPath Vapi webhook security checks
on:
  push:
    paths:
      - 'netlify/functions/vitalpath-vapi-events.js'
      - 'tests/vitalpath-vapi-events.test.js'
      - '.github/workflows/vitalpath-vapi-tests.yml'
  pull_request:
    paths:
      - 'netlify/functions/vitalpath-vapi-events.js'
      - 'tests/vitalpath-vapi-events.test.js'
      - '.github/workflows/vitalpath-vapi-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test Vapi webhook fail-closed and tenant isolation
        run: node --test tests/vitalpath-vapi-events.test.js
